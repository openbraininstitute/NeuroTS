name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        min_versions: ["min_versions", "latest_versions"]
        exclude:
          - min_versions: "min_versions"
        include:
          - python-version: "3.10"
            min_versions: "min_versions"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache tox environments
        uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.min_versions }}-${{ hashFiles('pyproject.toml', '.pre-commit-config.yaml', 'tox.ini') }}

      - name: Clear results in tox environments
        run: rm -rf .tox/*/tmp

      - name: Install tox
        run: |
          python -m pip install --upgrade pip setuptools
          pip install tox tox-gh-actions

      - name: Run tox with latest versions
        if: matrix.min_versions == 'latest_versions'
        run: tox

      - name: Run tox with min versions
        if: matrix.min_versions == 'min_versions'
        run: tox run -e min_versions

      - name: JUnit Report Action
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: reports/pytest-*.xml

      - name: Upload to codecov
        uses: codecov/codecov-action@v5
        if: matrix.min_versions == 'latest_versions'
        with:
          fail_ci_if_error: false
          directory: ./reports
          flags: pytest
          name: "NeuroTS-py${{ matrix.python-version }}"
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.python-version }}-${{ matrix.min_versions }}
          retention-days: 4
          path: |
            .tox/py*/tmp
            docs/build
            reports
